<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrategia y Gobernanza de Business Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #483C9A;
      --accent-light: #6b5bcf;
      --accent-soft: rgba(72, 60, 154, 0.08);
      --accent-glow: rgba(72, 60, 154, 0.2);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-light: rgba(72, 60, 154, 0.2);
      --radius-lg: 16px;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Centrado vertical */
      align-items: center;     /* Centrado horizontal */
      gap: 2rem;
      overflow-x: hidden;
    }

    /* INSTRUCCIÓN FLOTANTE */
    .floating-instruction {
      background: #ffffff;
      border: 1px solid var(--accent-light);
      color: var(--accent);
      padding: 0.6rem 1.4rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 15px rgba(72, 60, 154, 0.12);
      animation: pulse 2.5s infinite ease-in-out;
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translateY(0);
        box-shadow: 0 4px 15px rgba(72, 60, 154, 0.12);
      }
      50% {
        transform: translateY(-3px);
        box-shadow: 0 8px 22px rgba(72, 60, 154, 0.22);
      }
    }

    /* CONTENEDOR PRINCIPAL / GRID */
    .container {
      width: 100%;
      max-width: 1100px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      justify-content: center;
    }

    /* TARJETAS INTERACTIVAS CENTRADAS */
    .card-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-top: 5px solid var(--accent);
      border-radius: var(--radius-lg);
      height: 220px;
      cursor: pointer;
      text-align: center;
      outline: none;
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.8rem 1.5rem 1.5rem 1.5rem;
      gap: 0.8rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    /* BADGE DE NÚMERO */
    .card-number {
      position: absolute;
      top: 12px;
      left: 14px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(72, 60, 154, 0.25);
    }

    .card-btn h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.4;
      text-align: center;
      margin-top: 0.5rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      color: var(--accent-light);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card-footer span {
      transition: var(--transition-smooth);
      display: inline-block;
    }

    /* EFECTOS HOVER */
    .card-btn:hover, .card-btn:focus-visible {
      transform: translateY(-5px);
      border-color: var(--accent-light);
      border-top-color: var(--accent);
      box-shadow: 0 12px 30px var(--accent-glow);
      background: #ffffff;
    }

    .card-btn:hover .card-footer span {
      transform: translateX(4px);
    }

    /* VENTANA EMERGENTE (MODAL) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition-smooth);
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-top: 6px solid var(--accent);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      transform: scale(0.85) translateY(20px);
      transition: var(--transition-smooth);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1) translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .modal-close:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .modal-header-tag {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.8rem;
    }

    .modal-box h2 {
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 1rem;
      padding-right: 2rem;
      line-height: 1.4;
      text-align: left;
    }

    .modal-box div.content {
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1.7;
      text-align: left;
    }

    .modal-box div.content p {
      margin-bottom: 1rem;
    }

    .modal-hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
      border-top: 1px solid var(--border-light);
      padding-top: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- INSTRUCCIÓN FLOTANTE -->
  <div class="floating-instruction">
    💡 Haga clic sobre las tarjetas para ampliar la información.
  </div>

  <!-- REJILLA DE TARJETAS (5 ELEMENTOS) -->
  <main class="container">
    <div class="grid-cards">

      <!-- Tarjeta 1 -->
      <button class="card-btn" onclick="openModal('1', 'Comprender la importancia estratégica del Business Intelligence en las organizaciones', `
        <p>Analizar cómo las soluciones de inteligencia de negocios contribuyen a la generación de conocimiento organizacional y al fortalecimiento de los procesos de toma de decisiones en contextos empresariales basados en datos.</p>
      `)">
        <span class="card-number">1</span>
        <h3>Comprender la importancia estratégica del Business Intelligence en las organizaciones</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 2 -->
      <button class="card-btn" onclick="openModal('2', 'Diseñar estrategias de Business Intelligence alineadas con los objetivos organizacionales', `
        <p>Identificar los elementos fundamentales que intervienen en la planificación de iniciativas de BI, incluyendo la definición de objetivos analíticos, indicadores clave de desempeño (KPI) y modelos de información que apoyen la gestión empresarial.</p>
      `)">
        <span class="card-number">2</span>
        <h3>Diseñar estrategias de Business Intelligence alineadas con los objetivos organizacionales</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 3 -->
      <button class="card-btn" onclick="openModal('3', 'Comprender los principios de gobernanza de datos en entornos analíticos', `
        <p>Analizar la importancia de establecer políticas, estándares y roles que permitan garantizar la calidad, seguridad y disponibilidad de los datos utilizados en los sistemas de inteligencia de negocios.</p>
      `)">
        <span class="card-number">3</span>
        <h3>Comprender los principios de gobernanza de datos en entornos analíticos</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 4 -->
      <button class="card-btn" onclick="openModal('4', 'Evaluar arquitecturas y herramientas utilizadas en soluciones de Business Intelligence', `
        <p>Reconocer los componentes tecnológicos que conforman las plataformas de BI, incluyendo sistemas de almacenamiento de datos, herramientas de integración, motores analíticos y plataformas de visualización de información.</p>
      `)">
        <span class="card-number">4</span>
        <h3>Evaluar arquitecturas y herramientas utilizadas en soluciones de Business Intelligence</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 5 -->
      <button class="card-btn" onclick="openModal('5', 'Desarrollar un proyecto aplicado de Business Intelligence', `
        <p>Integrar los conocimientos adquiridos durante el curso para analizar un escenario organizacional, proponer una solución de inteligencia de negocios y justificar su diseño considerando aspectos estratégicos, tecnológicos y analíticos.</p>
      `)">
        <span class="card-number">5</span>
        <h3>Desarrollar un proyecto aplicado de Business Intelligence</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

    </div>
  </main>

  <!-- PANTALLA EMERGENTE / MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOutside(event)">
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">&times;</button>
      <span class="modal-header-tag" id="modalTag">Módulo 1</span>
      <h2 id="modalTitle">Título del objetivo</h2>
      <div class="content" id="modalBody">Descripción detallada...</div>
      <div class="modal-hint">Presione <strong>Esc</strong> para cerrar</div>
    </div>
  </div>

  <script>
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTag = document.getElementById('modalTag');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    function openModal(num, title, htmlContent) {
      modalTag.innerText = `Objetivo ${num}`;
      modalTitle.innerText = title;
      modalBody.innerHTML = htmlContent;
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    function closeModalOnOutside(event) {
      if (event.target === modalOverlay) {
        closeModal();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
