<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componentes del costo en BI</title>
    
    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome CDN para iconos vectoriales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-page: #1e2229;     /* Fondo oscuro exacto al de la imagen */
            --text-color: #ffffff;  /* Texto blanco */
            --icon-tech: #00d2ff;   /* Creado para destacar la tecnología */
            --icon-people: #ff5252; /* Color cálido para personas */
            --icon-process: #00e676;/* Verde para flujos y procesos */
            --operator-color: #8da4c4; /* Azul pastel para símbolos + e = */
            --btn-bg: #8b5cf6;      /* Morado elegante para el botón */
            --btn-hover: #7c3aed;   /* Morado más oscuro al hover */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* --- Panel de Control / Instrucción y Botón --- */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            text-align: center;
        }

        .instruction-text {
            font-size: 0.95rem;
            color: #b3b9c5;
            font-weight: 400;
        }

        .btn-reset {
            background-color: var(--btn-bg);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
        }

        .btn-reset:hover {
            background-color: var(--btn-hover);
        }

        .btn-reset:active {
            transform: scale(0.96);
        }

        /* --- Título Principal --- */
        .main-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 50px;
            text-align: center;
            letter-spacing: -0.5px;
            opacity: 0;
        }

        /* --- Estructura de la Ecuación --- */
        .bi-equation-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            max-width: 1100px;
            width: 100%;
        }

        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
        }

        .icon-wrapper {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .icon-wrapper i {
            font-size: 75px;
        }

        /* Colores específicos para los iconos estilo la imagen */
        .tech-icon i { color: var(--icon-tech); }
        .people-icon i { color: var(--icon-people); }
        .process-icon i { color: var(--icon-process); }

        .item-label {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-color);
        }

        /* Operadores (+ e =) */
        .operator {
            font-size: 3rem;
            font-weight: 700;
            color: var(--operator-color);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            user-select: none;
        }

        /* Resultado Final */
        .total-cost-item {
            text-align: left;
            align-items: flex-start;
        }

        .total-cost-text {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.15;
            color: var(--text-color);
        }

        /* --- Animación Látigo (Whip) --- */
        .animate-whip {
            animation: whipIn 0.8s cubic-bezier(0.68, -0.6, 0.32, 1.6) forwards;
        }

        @keyframes whipIn {
            0% {
                opacity: 0;
                transform: translateX(-120px) scaleX(1.4) skewX(-20deg);
            }
            70% {
                opacity: 1;
                transform: translateX(15px) scaleX(0.95) skewX(5deg);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scaleX(1) skewX(0deg);
            }
        }

        /* Delays escalonados para la ecuación completa */
        .delay-0 { animation-delay: 0.0s; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.22s; }
        .delay-3 { animation-delay: 0.34s; }
        .delay-4 { animation-delay: 0.46s; }
        .delay-5 { animation-delay: 0.58s; }
        .delay-6 { animation-delay: 0.70s; }
        .delay-7 { animation-delay: 0.82s; }

        /* Responsividad */
        @media (max-width: 850px) {
            .main-title {
                font-size: 1.7rem;
                margin-bottom: 30px;
            }

            .bi-equation-container {
                flex-direction: column;
                gap: 20px;
            }

            .total-cost-item {
                text-align: center;
                align-items: center;
            }

            .total-cost-text {
                font-size: 1.5rem;
            }

            .operator {
                font-size: 2.2rem;
            }

            @keyframes whipIn {
                0% {
                    opacity: 0;
                    transform: translateY(-80px) scaleY(1.3) skewY(-10deg);
                }
                70% {
                    opacity: 1;
                    transform: translateY(10px) scaleY(0.95) skewY(3deg);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0) scaleY(1) skewY(0deg);
                }
            }
        }
    </style>
</head>
<body>

    <!-- Zona de Control -->
    <div class="controls-container">
        <p class="instruction-text">Haga clic sobre el botón "Reiniciar ▶" para reiniciar la animación.</p>
        <button class="btn-reset" onclick="resetAnimation()">Reiniciar ▶</button>
    </div>

    <!-- Título Principal -->
    <h1 class="main-title animate-whip delay-0">Componentes del costo en BI</h1>

    <!-- Estructura de la Ecuación -->
    <div class="bi-equation-container" id="equation-container">
        
        <!-- Elemento 1: Tecnología -->
        <div class="item animate-whip delay-1">
            <div class="icon-wrapper tech-icon">
                <i class="fa-solid fa-microchip"></i>
            </div>
            <span class="item-label">Tecnología</span>
        </div>

        <!-- Operador + -->
        <div class="operator animate-whip delay-2">
            <i class="fa-solid fa-plus"></i>
        </div>

        <!-- Elemento 2: Personas -->
        <div class="item animate-whip delay-3">
            <div class="icon-wrapper people-icon">
                <i class="fa-solid fa-users-gear"></i>
            </div>
            <span class="item-label">Personas</span>
        </div>

        <!-- Operador + -->
        <div class="operator animate-whip delay-4">
            <i class="fa-solid fa-plus"></i>
        </div>

        <!-- Elemento 3: Procesos -->
        <div class="item animate-whip delay-5">
            <div class="icon-wrapper process-icon">
                <i class="fa-solid fa-diagram-project"></i>
            </div>
            <span class="item-label">Procesos</span>
        </div>

        <!-- Operador = -->
        <div class="operator animate-whip delay-6">
            <i class="fa-solid fa-equals"></i>
        </div>

        <!-- Resultado: Costo Total BI -->
        <div class="item total-cost-item animate-whip delay-7">
            <div class="total-cost-text">
                Costo<br>Total BI
            </div>
        </div>

    </div>

    <!-- Script de Reinicio -->
    <script>
        function resetAnimation() {
            const animatedElements = document.querySelectorAll('.animate-whip');
            
            animatedElements.forEach(el => {
                el.classList.remove('animate-whip');
                void el.offsetWidth; // Reflow para reiniciar animación
                el.classList.add('animate-whip');
            });
        }
    </script>

</body>
</html>
