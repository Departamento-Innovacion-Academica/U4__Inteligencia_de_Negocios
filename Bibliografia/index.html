<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gobierno de Datos, Self-Service BI y Ciberseguridad - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #483C9A; 
            --accent-bright: #b3a6ff; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(72, 60, 154, 0.4);
            --text-main: #ffffff;
            --text-dim: #dfdbf7;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #05040f;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #070617; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #1a1540 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(72, 60, 154, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
        }
        .card:hover { border-color: var(--accent-bright); transform: translateY(-5px); background: rgba(72, 60, 154, 0.12); box-shadow: 0 10px 20px rgba(72, 60, 154, 0.25); }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(72, 60, 154, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-all;
        }

        .link-text {
            color: var(--accent-bright);
            text-decoration: underline;
            transition: color 0.2s;
        }
        .link-text:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        📊 <b>Instrucción de Navegación:</b> Consulta las normativas, estándares e investigaciones fundamentales en Gobierno de Datos, Inteligencia de Negocios Autoservicio y Seguridad de la Información.
    </div>

    <header class="main-header">
        <h1>Gobierno de Datos, Self-Service BI y Ciberseguridad</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "Alpar, P., & Schulz, M. (2016)", t: "Self-service business intelligence", f: "Business & Information Systems Engineering" },
            { a: "DAMA International (2017)", t: "DAMA-DMBOK: Data Management Body of Knowledge", f: "Technics Publications" },
            { a: "European Parliament (2016)", t: "General Data Protection Regulation (GDPR)", f: "European Union", u: "https://gdpr.eu" },
            { a: "Imhoff, C., & White, C. (2011)", t: "Self-service business intelligence: Empowering users to generate insights", f: "TDWI" },
            { a: "ISO (2011)", t: "ISO 8000 Data Quality", f: "International Organization for Standardization", u: "https://www.iso.org" },
            { a: "ISO (2022)", t: "ISO/IEC 27001 Information Security Management", f: "International Organization for Standardization", u: "https://www.iso.org" },
            { a: "Khatri, V., & Brown, C. (2010)", t: "Designing data governance", f: "Communications of the ACM" },
            { a: "Kshetri, N. (2021)", t: "Cybersecurity management in organizations", f: "IT Professional" },
            { a: "Lennerholt, C., van Laere, J., & Söderström, E. (2018)", t: "Self-service BI: A literature review", f: "Journal of Decision Systems" },
            { a: "Loshin, D. (2019)", t: "Business Intelligence: The Savvy Manager’s Guide", f: "Morgan Kaufmann" },
            { a: "NIST (2020)", t: "NIST Cybersecurity Framework", f: "National Institute of Standards and Technology", u: "https://www.nist.gov" },
            { a: "Passlick, J., Lebek, B., & Breitner, M. (2017)", t: "A self-service business intelligence approach", f: "Decision Support Systems" },
            { a: "Project Management Institute (PMI) (2021)", t: "A Guide to the Project Management Body of Knowledge (PMBOK Guide)", f: "PMI" },
            { a: "Watson, H., & Wixom, B. (2007)", t: "The Current State of Business Intelligence", f: "Journal of Database Management" },
            { a: "Wirth, R., & Hipp, J. (2000)", t: "CRISP-DM: Towards a standard process model for data mining", f: "Proceedings of the 4th International Conference on Data Mining" },
            { a: "Wixom, B., & Watson, H. (2010)", t: "The BI-based organization", f: "International Journal of Business Intelligence Research" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let footerContent = s.f;
            if (s.u) {
                footerContent += ` — <a href="${s.u}" target="_blank" class="link-text">${s.u}</a>`;
            }

            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${footerContent}</div>
            `;

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
