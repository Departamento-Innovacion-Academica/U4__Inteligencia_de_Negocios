<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flujo Herramientas BI a Mejores Decisiones</title>
    
    <!-- Fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome CDN para iconos vectoriales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-page: #ffffff;
            --card-bg: #0d47a1;     /* Azul azulado intenso exacto al de la imagen */
            --text-color: #ffffff;  /* Texto blanco */
            --arrow-color: #0d47a1; /* Mismo tono de azul para las flechas conectoras */
            --btn-bg: #6b21a8;      /* Morado para el botón principal */
            --btn-hover: #581c87;   /* Morado oscuro hover */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-page);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* --- Panel de Control / Instrucción y Botón --- */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 50px;
            text-align: center;
        }

        .instruction-text {
            font-size: 0.95rem;
            color: #555;
            font-weight: 500;
        }

        .btn-reset {
            background-color: var(--btn-bg);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(107, 33, 168, 0.25);
        }

        .btn-reset:hover {
            background-color: var(--btn-hover);
        }

        .btn-reset:active {
            transform: scale(0.96);
        }

        /* --- Estructura Principal de Tarjetas Azules --- */
        .cards-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 20px rgba(13, 71, 161, 0.25);
            min-height: 240px;
            
            /* Preparación para animación */
            opacity: 0;
        }

        .icon-container {
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .icon-container i {
            font-size: 70px;
            color: #ffffff;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.25;
            text-align: center;
        }

        /* Flechas Azules entre tarjetas */
        .arrow-separator {
            color: var(--arrow-color);
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0;
        }

        /* --- Animación Látigo (Whip) --- */
        .animate-whip {
            animation: whipIn 0.8s cubic-bezier(0.68, -0.6, 0.32, 1.6) forwards;
        }

        @keyframes whipIn {
            0% {
                opacity: 0;
                transform: translateX(-120px) scaleX(1.4) skewX(-20deg);
            }
            70% {
                opacity: 1;
                transform: translateX(15px) scaleX(0.95) skewX(5deg);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scaleX(1) skewX(0deg);
            }
        }

        /* Retrasos escalonados para 4 tarjetas y 3 flechas */
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.15s; }
        .delay-3 { animation-delay: 0.25s; }
        .delay-4 { animation-delay: 0.35s; }
        .delay-5 { animation-delay: 0.45s; }
        .delay-6 { animation-delay: 0.55s; }
        .delay-7 { animation-delay: 0.65s; }

        /* Responsividad para móviles */
        @media (max-width: 900px) {
            .cards-container {
                flex-direction: column;
                gap: 20px;
            }

            .card {
                width: 100%;
                max-width: 320px;
                min-height: auto;
                padding: 25px 15px;
            }

            .arrow-separator {
                transform: rotate(90deg);
            }

            @keyframes whipIn {
                0% {
                    opacity: 0;
                    transform: translateY(-80px) scaleY(1.3) skewY(-10deg);
                }
                70% {
                    opacity: 1;
                    transform: translateY(10px) scaleY(0.95) skewY(3deg);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0) scaleY(1) skewY(0deg);
                }
            }
        }
    </style>
</head>
<body>

    <!-- Zona de Control -->
    <div class="controls-container">
        <p class="instruction-text">Haga clic sobre el botón "Reiniciar ▶" para reiniciar la animación.</p>
        <button class="btn-reset" onclick="resetAnimation()">Reiniciar ▶</button>
    </div>

    <!-- Estructura del Flujo de 4 Tarjetas -->
    <div class="cards-container" id="cards-container">
        
        <!-- Tarjeta 1: Herramientas BI -->
        <div class="card animate-whip delay-1">
            <div class="icon-container">
                <i class="fa-solid fa-laptop-code"></i>
            </div>
            <h3 class="card-title">Herramientas BI</h3>
        </div>

        <!-- Flecha 1 -->
        <div class="arrow-separator animate-whip delay-2">
            <i class="fa-solid fa-arrow-right"></i>
        </div>

        <!-- Tarjeta 2: Usuarios -->
        <div class="card animate-whip delay-3">
            <div class="icon-container">
                <i class="fa-solid fa-users"></i>
            </div>
            <h3 class="card-title">Usuarios</h3>
        </div>

        <!-- Flecha 2 -->
        <div class="arrow-separator animate-whip delay-4">
            <i class="fa-solid fa-arrow-right"></i>
        </div>

        <!-- Tarjeta 3: Habilidades -->
        <div class="card animate-whip delay-5">
            <div class="icon-container">
                <i class="fa-solid fa-user-gear"></i>
            </div>
            <h3 class="card-title">Habilidades</h3>
        </div>

        <!-- Flecha 3 -->
        <div class="arrow-separator animate-whip delay-6">
            <i class="fa-solid fa-arrow-right"></i>
        </div>

        <!-- Tarjeta 4: Mejores decisiones -->
        <div class="card animate-whip delay-7">
            <div class="icon-container">
                <i class="fa-solid fa-route"></i>
            </div>
            <h3 class="card-title">Mejores<br>decisiones</h3>
        </div>

    </div>

    <!-- Script de Reinicio -->
    <script>
        function resetAnimation() {
            const animatedElements = document.querySelectorAll('#cards-container .animate-whip');
            
            animatedElements.forEach(el => {
                el.classList.remove('animate-whip');
                void el.offsetWidth; // Reflow para reiniciar la animación CSS
                el.classList.add('animate-whip');
            });
        }
    </script>

</body>
</html>
