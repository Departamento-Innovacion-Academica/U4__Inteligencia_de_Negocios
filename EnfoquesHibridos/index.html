<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Cards Minimalistas BI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #faf9fc;
            color: #111111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px 40px;
        }

        /* Instrucción flotante arriba */
        .instruction-banner {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #ebdffc;
            color: #6b46c1;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 20px rgba(107, 70, 193, 0.08);
            z-index: 100;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cards-container {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        /* Ocultar checkbox */
        .card-toggle {
            display: none;
        }

        /* Estructura general de la tarjeta */
        .card {
            width: 360px;
            height: 490px;
            perspective: 1200px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        /* Giro al hacer clic */
        .card-toggle:checked + .card .card-inner {
            transform: rotateY(180deg);
        }

        /* Caras de la tarjeta */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 16px;
            padding: 36px 30px;
            background: #ffffff;
            border: 1px solid #ebdffc;
            box-shadow: 0 10px 30px rgba(107, 70, 193, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover .card-front,
        .card:hover .card-back {
            border-color: #d6bcfa;
            box-shadow: 0 14px 40px rgba(107, 70, 193, 0.08);
        }

        /* Cara Frontal - Elegante con acento morado */
        .card-front {
            align-items: flex-start;
            text-align: left;
        }

        .card-front .tag {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #805ad5;
        }

        .card-front h2 {
            font-size: 1.35rem;
            font-weight: 500;
            color: #1a102f;
            line-height: 1.4;
            letter-spacing: -0.3px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .card-front .action-hint {
            font-size: 0.8rem;
            font-weight: 500;
            color: #6b46c1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-front .action-hint::after {
            content: '→';
            font-size: 1rem;
            transition: transform 0.3s ease;
        }

        .card:hover .action-hint::after {
            transform: translateX(4px);
        }

        /* Cara Trasera - Detalle sutil morado */
        .card-back {
            transform: rotateY(180deg);
            text-align: left;
            overflow-y: auto;
        }

        .card-back h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a102f;
            line-height: 1.35;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f3ebff;
            letter-spacing: -0.2px;
        }

        .card-back p {
            font-size: 0.88rem;
            font-weight: 300;
            line-height: 1.6;
            color: #383146;
            margin-bottom: 14px;
        }

        .card-back ul {
            list-style: none;
            margin-bottom: 14px;
        }

        .card-back li {
            font-size: 0.88rem;
            font-weight: 300;
            line-height: 1.6;
            color: #383146;
            margin-bottom: 8px;
            position: relative;
            padding-left: 16px;
        }

        .card-back li::before {
            content: '—';
            position: absolute;
            left: 0;
            color: #9f7aea;
        }

        .card-back .close-hint {
            margin-top: auto;
            padding-top: 12px;
            font-size: 0.75rem;
            color: #b794f4;
            text-align: right;
            font-weight: 400;
        }

        /* Scrollbar personalizada */
        .card-back::-webkit-scrollbar {
            width: 4px;
        }

        .card-back::-webkit-scrollbar-thumb {
            background: #e9d8fd;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Instrucción Flotante -->
    <div class="instruction-banner">
        <span>✦</span> haga clic sobre las tarjetas para ampliar la información.
    </div>

    <div class="cards-container">

        <!-- Tarjeta 1 -->
        <input type="checkbox" id="card1" class="card-toggle">
        <label for="card1" class="card">
            <div class="card-inner">
                <div class="card-front">
                    <span class="tag">Sección 1.1.6.6</span>
                    <h2>1.1.6.6 Enfoques híbridos en BI</h2>
                    <span class="action-hint">Ver detalles</span>
                </div>
                <div class="card-back">
                    <div>
                        <h2>1.1.6.6 Enfoques híbridos en BI</h2>
                        <p>En la práctica, muchas organizaciones combinan diferentes metodologías para aprovechar sus ventajas.</p>
                        <p>Por ejemplo:</p>
                        <ul>
                            <li>CRISP-DM para análisis de datos.</li>
                            <li>Agile para desarrollo iterativo.</li>
                            <li>PMI para control del proyecto.</li>
                        </ul>
                        <p>Este enfoque híbrido permite adaptarse a las necesidades específicas del proyecto.</p>
                    </div>
                    <span class="close-hint">Volver ↺</span>
                </div>
            </div>
        </label>

        <!-- Tarjeta 2 -->
        <input type="checkbox" id="card2" class="card-toggle">
        <label for="card2" class="card">
            <div class="card-inner">
                <div class="card-front">
                    <span class="tag">Sección 1.1.6.7</span>
                    <h2>1.1.6.7 Factores críticos de éxito en proyectos BI</h2>
                    <span class="action-hint">Ver detalles</span>
                </div>
                <div class="card-back">
                    <div>
                        <h2>1.1.6.7 Factores críticos de éxito en proyectos BI</h2>
                        <p>Para asegurar el éxito de los proyectos de BI, es importante considerar:</p>
                        <ul>
                            <li>Calidad de los datos.</li>
                            <li>Participación de usuarios de negocio.</li>
                            <li>Claridad en los objetivos.</li>
                            <li>Uso adecuado de metodologías.</li>
                            <li>Gestión del cambio organizacional.</li>
                        </ul>
                        <p>Estos factores influyen directamente en la efectividad de las soluciones implementadas.</p>
                    </div>
                    <span class="close-hint">Volver ↺</span>
                </div>
            </div>
        </label>

        <!-- Tarjeta 3 -->
        <input type="checkbox" id="card3" class="card-toggle">
        <label for="card3" class="card">
            <div class="card-inner">
                <div class="card-front">
                    <span class="tag">Sección 1.1.6.8</span>
                    <h2>1.1.6.8 Relación con la estrategia de BI</h2>
                    <span class="action-hint">Ver detalles</span>
                </div>
                <div class="card-back">
                    <div>
                        <h2>1.1.6.8 Relación con la estrategia de BI</h2>
                        <p>Las metodologías de proyectos deben alinearse con la estrategia de BI para garantizar que las soluciones desarrolladas generen valor para la organización.</p>
                        <p>Esto implica:</p>
                        <ul>
                            <li>Priorizar iniciativas estratégicas.</li>
                            <li>Evaluar resultados.</li>
                            <li>Asegurar la sostenibilidad del proyecto.</li>
                        </ul>
                    </div>
                    <span class="close-hint">Volver ↺</span>
                </div>
            </div>
        </label>

    </div>

</body>
</html>
